# Grafana overlay - deploy alongside Supabase and Caddy
#
# Usage:
#   Start (first time or after changes):
#     docker compose -f docker-compose.yml -f docker-compose.caddy.yml -f docker-compose.grafana.yml up -d grafana
#   Then reload Caddy to pick up routing:
#     docker exec supabase-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
#
# Access Grafana at: https://<PROXY_DOMAIN>/          (root — Grafana login)
# Access Studio  at: https://<PROXY_DOMAIN>/supabase  (Caddy basic-auth, then Studio)
#
# Required .env variables:
#   GRAFANA_ADMIN_USER     - Grafana admin username (default: admin)
#   GRAFANA_ADMIN_PASSWORD - Grafana admin password (must be set — no default)
#   PROXY_DOMAIN           - Same domain/IP used by Caddy (e.g. 147.182.210.222)

name: supabase

services:
  grafana:
    container_name: supabase-grafana
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_APP_TITLE: Skywind Solutions
      # SMTP settings for Grafana unified alerting email notifications.
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-alerts@example.com}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-Skywind Alerts}
      GF_SMTP_SKIP_VERIFY: ${GRAFANA_SMTP_SKIP_VERIFY:-true}
      # Grafana is served at the domain root behind the Caddy proxy
      GF_SERVER_ROOT_URL: https://${PROXY_DOMAIN}/
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # Disable telemetry
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Disable sharing features that are not allowed in this environment.
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: system
      # Format hourly x-axis labels as Tue 04/07 06 PM.
      GF_DATE_FORMATS_INTERVAL_HOUR: "ddd MM/DD hh A"
      # Exposed for datasource provisioning variable substitution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Recipient list used by provisioned alert contact points.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@example.com}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./volumes/grafana/provisioning:/etc/grafana/provisioning
      # Custom branding: replace Grafana logo and favicon with Skywind assets
      # Grafana serves static assets from public/build/img/ (not public/img/)
      - ./volumes/grafana/img/grafana_icon.svg:/usr/share/grafana/public/build/img/grafana_icon.svg:ro
      - ./volumes/grafana/img/grafana_typelogo.svg:/usr/share/grafana/public/build/img/grafana_typelogo.svg:ro
      - ./volumes/grafana/img/fav32.png:/usr/share/grafana/public/build/img/fav32.png:ro
      # Main login page logo (text logo, dark and light theme variants)
      - ./volumes/grafana/img/grafana_text_logo_dark.svg:/usr/share/grafana/public/build/img/grafana_text_logo_dark.svg:ro
      - ./volumes/grafana/img/grafana_text_logo_light.svg:/usr/share/grafana/public/build/img/grafana_text_logo_light.svg:ro
      - ./volumes/grafana/img/grafana_text_logo-dark.svg:/usr/share/grafana/public/build/img/grafana_text_logo-dark.svg:ro
      - ./volumes/grafana/img/grafana_text_logo-light.svg:/usr/share/grafana/public/build/img/grafana_text_logo-light.svg:ro
      # Hashed static asset paths (actual paths used by the JS bundles at runtime)
      - ./volumes/grafana/img/grafana_icon.svg:/usr/share/grafana/public/build/static/img/grafana_icon.1e0deb6b.svg:ro
      - ./volumes/grafana/img/grafana_text_logo_dark.svg:/usr/share/grafana/public/build/static/img/grafana_text_logo_dark.70a1e5ee.svg:ro
      - ./volumes/grafana/img/grafana_text_logo_light.svg:/usr/share/grafana/public/build/static/img/grafana_text_logo_light.467e047c.svg:ro
      # Patched Grafana frontend bundle: replaces the login welcome heading text.
      - ./volumes/grafana/build/8060.5e67a0b955ad52462e5e.js:/usr/share/grafana/public/build/8060.5e67a0b955ad52462e5e.js:ro
      - ./volumes/grafana/build/9521.77ebae84b28ee91d9e4f.js:/usr/share/grafana/public/build/9521.77ebae84b28ee91d9e4f.js:ro
      - ./volumes/grafana/build/gettingStartedPanel.91777d9ac8db39b12877.js:/usr/share/grafana/public/build/gettingStartedPanel.91777d9ac8db39b12877.js:ro
      - ./volumes/grafana/build/welcomeBanner.103426aa0e53dbf255aa.js:/usr/share/grafana/public/build/welcomeBanner.103426aa0e53dbf255aa.js:ro
      # Custom HTML template: injects CSS to enlarge the login page logo
      - ./volumes/grafana/index.html:/usr/share/grafana/public/views/index.html:ro

volumes:
  grafana_data:
    driver: local
