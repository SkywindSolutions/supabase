# Alert Service overlay — SMS threshold alerts for tide data.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml \
#     -f docker-compose.grafana.yml -f docker-compose.alerts.yml up -d alerts
#   Then reload Caddy to pick up the /api/alerts route:
#     docker exec supabase-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
#
# Required .env variables:
#   POSTGRES_PASSWORD       — same as main stack
#   TWILIO_ACCOUNT_SID      — Twilio Account SID (leave blank to skip SMS)
#   TWILIO_AUTH_TOKEN        — Twilio Auth Token
#   TWILIO_FROM_NUMBER       — Twilio phone number in E.164 format (e.g. +15551234567)

name: supabase

services:
  alerts:
    container_name: supabase-alerts
    build:
      context: .
      dockerfile: Dockerfile.alerts
    restart: unless-stopped
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/api/alerts/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_INTERNAL_URL: http://supabase-grafana:3000
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      CHECK_INTERVAL_SECONDS: ${ALERT_CHECK_INTERVAL:-300}
      LOG_LEVEL: ${ALERT_LOG_LEVEL:-INFO}
