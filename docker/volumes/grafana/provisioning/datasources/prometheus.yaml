# Grafana datasource provisioning — Prometheus host metrics

apiVersion: 1

deleteDatasources:
  - name: prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://supabase-prometheus:9090
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
