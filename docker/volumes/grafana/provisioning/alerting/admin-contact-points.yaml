apiVersion: 1

contactPoints:
  - orgId: 1
    name: admin-email
    receivers:
      - uid: admin_email_receiver
        type: email
        disableResolveMessage: false
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: false

policies:
  - orgId: 1
    receiver: admin-email
    group_by:
      - alertname
      - instance
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: admin-email
        object_matchers:
          - ["team", "=", "infra"]
