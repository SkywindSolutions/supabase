apiVersion: 1

groups:
  - orgId: 1
    name: server-threshold-alerts
    folder: Internal Dashboards
    interval: 1m
    rules:
      - uid: cpu_usage_gt_80
        title: CPU usage above 80%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              intervalMs: 1000
              legendFormat: "{{instance}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: internal-server-stats
        panelId: 1
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: CPU usage is above 80%
          description: CPU usage has remained above 80% for 5 minutes on {{ $labels.instance }}.
        labels:
          severity: critical
          team: infra

      - uid: mem_usage_gt_80
        title: Memory usage above 80%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              instant: true
              intervalMs: 1000
              legendFormat: "{{instance}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: internal-server-stats
        panelId: 2
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Memory usage is above 80%
          description: Memory usage has remained above 80% for 5 minutes on {{ $labels.instance }}.
        labels:
          severity: critical
          team: infra

      - uid: root_disk_usage_gt_75
        title: Root filesystem usage above 75%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) * 100
              instant: true
              intervalMs: 1000
              legendFormat: "{{instance}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 75
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: internal-server-stats
        panelId: 3
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Root filesystem usage is above 75%
          description: Root filesystem usage has remained above 75% for 5 minutes on {{ $labels.instance }}.
        labels:
          severity: warning
          team: infra

      - uid: nyc_volume_usage_gt_80
        title: /mnt/volume_nyc1_01 usage above 80%
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/mnt/volume_nyc1_01",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/mnt/volume_nyc1_01",fstype!~"tmpfs|overlay|squashfs"})) * 100
              instant: true
              intervalMs: 1000
              legendFormat: "{{instance}}"
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        dashboardUid: internal-server-stats
        panelId: 4
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: /mnt/volume_nyc1_01 usage is above 80%
          description: /mnt/volume_nyc1_01 usage has remained above 80% for 5 minutes on {{ $labels.instance }}.
        labels:
          severity: critical
          team: infra

      - uid: forecast_data_stale_6h
        title: Forecast data stale for location
        condition: B
        data:
          - refId: A
            datasourceUid: supabase-postgres
            relativeTimeRange:
              from: 21600
              to: 0
            model:
              datasource:
                type: postgres
                uid: supabase-postgres
              editorMode: code
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: |
                WITH latest_runs AS (
                  SELECT
                    group_id,
                    locid,
                    locname,
                    MAX(startdt) AS latest_run_at
                  FROM forecast_data
                  WHERE startdt IS NOT NULL
                    AND group_id IS NOT NULL
                    AND locid IS NOT NULL
                    AND locname IS NOT NULL
                  GROUP BY group_id, locid, locname
                )
                SELECT
                  group_id,
                  locid,
                  locname,
                  EXTRACT(EPOCH FROM (NOW() - latest_run_at)) / 3600 AS hours_since_latest_run
                FROM latest_runs
                WHERE latest_run_at < NOW() - INTERVAL '6 hours'
                ORDER BY hours_since_latest_run DESC
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 6
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Forecast data has not refreshed for a location
          description: "{{ $labels.group_id }} / {{ $labels.locid }} ({{ $labels.locname }}) has not received a model run in more than 6 hours."
        labels:
          severity: critical
          team: infra
